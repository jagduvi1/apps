resources:
  limits:
    cpus: 2.0
    memory: 4096

cellarion:
  mongo_db_password: secret
  meilisearch_master_key: exactly-16-chars
  jwt_secret: exactly-32-characters-jwt-secret
  frontend_url: http://localhost:8080
  anthropic_api_key: ""
  voyage_api_key: ""
  registry_bridge_key: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  uploads: /opt/tests/mnt/cellarion/uploads
  mongodb_data: /opt/tests/mnt/cellarion/mongodb_data
  meili_data: /opt/tests/mnt/cellarion/meili_data

storage:
  uploads:
    type: ix_volume
    ix_volume_config:
      dataset_name: uploads
      create_host_path: true
  meili_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: meili_data
      create_host_path: true
  mongodb_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: mongodb_data
      create_host_path: true
  additional_storage: []
